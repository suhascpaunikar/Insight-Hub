# Publishes the prototype to GitHub Pages.
#
# The homepage is now a Vite build (React + Cloudflare Kumo), so this compiles
# before uploading rather than pushing the repo up as-is. `vite build` also
# copies the three screens that are still plain HTML and ES modules into
# `dist/` untouched, so one artifact carries the whole site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      # Pages must already be enabled with source "GitHub Actions": the
      # workflow's GITHUB_TOKEN cannot create the Pages site itself, so
      # configure-pages only reads the existing configuration here.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
