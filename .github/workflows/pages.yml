# Publishes the prototype to GitHub Pages. There is nothing to compile — the
# site is plain HTML, CSS and ES modules — so the job just uploads the repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be enabled with source "GitHub Actions": the
      # workflow's GITHUB_TOKEN cannot create the Pages site itself, so
      # configure-pages only reads the existing configuration here.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
